# Scratch Postgres for `pnpm test:integration`. Logical replication enabled, on a
# non-default port (5434) so it never collides with a local app database.
#
#   docker compose -f docker-compose.test.yml up -d
#   pnpm test:integration
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres:
    image: postgres:16
    container_name: pg-realtime-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgrealtime_test
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pgrealtime_test']
      interval: 1s
      timeout: 3s
      retries: 30
